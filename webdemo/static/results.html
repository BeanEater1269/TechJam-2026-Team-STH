<!DOCTYPE html>
<html>
<head>
  <title>Results Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <span class="team-name">Team Sweaty Try Hard</span>
    <nav class="nav">
      <a href="/">Detector</a>
      <a href="/live">Live</a>
      <a href="/results" class="active">Results</a>
    </nav>
    <img src="/static/logo.png" alt="TikTok TechJam 2026" class="logo" onerror="this.style.display='none'">
  </header>

  <h1>Results Dashboard</h1>
  <p class="subtitle">AUC on clean images vs. each transformation — Base vs. Concatenation vs. FiLM</p>

  <div class="backbone-switcher">
    <button class="backbone-tab" data-backbone="b32">ViT-B/32</button>
    <button class="backbone-tab" data-backbone="l14">ViT-L/14</button>
  </div>

  <div id="page-wrap">
    <div id="clean-summary"></div>

    <div id="chart-grid"></div>

    <details id="detail-table-wrap">
      <summary>Full accuracy / AUC table</summary>
      <table id="detail-table">
        <thead>
          <tr>
            <th>Condition</th>
            <th colspan="2">Base</th>
            <th colspan="2">Concatenation</th>
            <th colspan="2">FiLM</th>
          </tr>
          <tr class="subhead">
            <th></th>
            <th>Acc.</th><th>AUC</th>
            <th>Acc.</th><th>AUC</th>
            <th>Acc.</th><th>AUC</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </details>
  </div>

  <script src="/static/results-dashboard.js?v=2"></script>
</body>
</html>
