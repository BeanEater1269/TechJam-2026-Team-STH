<!DOCTYPE html>
<html>
<head>
  <title>Robustness Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <span class="team-name">Team Sweaty Try Hard</span>
    <nav class="nav">
      <a href="/">Detector</a>
      <a href="/dashboard" class="active">Dashboard</a>
    </nav>
    <img src="/static/logo.png" alt="TikTok TechJam 2026" class="logo" onerror="this.style.display='none'">
  </header>

  <h1>Robustness Evaluation</h1>
  <p class="subtitle">AUC on clean images vs. each transformation, Model A vs. Model B</p>

  <div id="page-wrap">
    <div id="clean-summary"></div>

    <div id="chart-grid"></div>

    <details id="detail-table-wrap">
      <summary>Full accuracy / AUC table</summary>
      <table id="detail-table">
        <thead>
          <tr>
            <th>Condition</th>
            <th colspan="2">Model A</th>
            <th colspan="2">Model B</th>
          </tr>
          <tr class="subhead">
            <th></th>
            <th>Acc.</th><th>AUC</th>
            <th>Acc.</th><th>AUC</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </details>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
