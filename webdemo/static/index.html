<!DOCTYPE html>
<html>
<head>
  <title>AIGC Detector Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <span class="team-name">Team Sweaty Try Hard</span>
    <nav class="nav">
      <a href="/" class="active">Detector</a>
      <a href="/dashboard">Dashboard</a>
    </nav>
    <img src="/static/logo.png" alt="TikTok TechJam 2026" class="logo" onerror="this.style.display='none'">
  </header>

  <h1>AI Image Detector</h1>

  <div id="app">
    <!-- State 1: waiting for an image -->
    <div id="dropzone">
      <p>Drag your image here</p>
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>

    <!-- State 2: waiting for the prediction -->
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyzing...</p>
    </div>

    <!-- State 3: showing the result -->
    <div id="result" class="hidden">
      <img id="preview-image" alt="Uploaded preview">
      <p id="result-label"></p>
      <p id="result-score"></p>
      <button id="try-again">Try another image</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
